spring.application.name=payment-service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/bidvelocity_payment
spring.datasource.username=root
spring.datasource.password=@Ark28102006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.com.bidvelocity.payment=INFO

info.app.name=BidVelocity Payment Service
info.app.description=Payment processing and settlement service
info.app.version=1.0.0