spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/bidvelocity_auth
spring.datasource.username=root
spring.datasource.password=@Ark28102006
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

jwt.secret=change-this-to-a-long-random-secret-key-for-bidvelocity-authentication
jwt.expiration=3600000

logging.level.com.bidvelocity.auth=INFO

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=BidVelocity Auth Service
info.app.description=Authentication and JWT authorization service
info.app.version=1.0.0